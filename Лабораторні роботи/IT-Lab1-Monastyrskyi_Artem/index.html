<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>FruitApp — Bootstrap</title>
        <link rel="stylesheet" href="vendor/bootstrap.min.css" />
        <link rel="stylesheet" href="css/styles.css" />
        <script src="vendor/jquery.min.js" defer></script>
        <script src="vendor/bootstrap.min.js" defer></script>
        <script src="js/script.js" defer></script>
    </head>
    <body>
        <div class="phone" aria-label="FruitApp mobile mockup">
            <div class="earpiece" aria-hidden="true"><i></i><span></span></div>
            <main class="screen container-fluid">
                <header class="row app-header">
                    <div class="col-xs-4">
                        <button
                            id="menu-button"
                            type="button"
                            class="icon-button"
                            aria-label="Open menu"
                            aria-expanded="false"
                        >
                            ☰
                        </button>
                    </div>
                    <div class="col-xs-4 brand">FruitApp</div>
                    <div class="col-xs-4 text-right">
                        <button
                            type="button"
                            class="icon-button"
                            aria-label="Add fruit"
                            data-toggle="modal"
                            data-target="#add-fruit"
                        >
                            +
                        </button>
                    </div>
                </header>
                <nav id="fruit-menu" hidden>
                    <button type="button" class="btn btn-default btn-sm" id="reset-fruit">
                        Apricot, raw
                    </button>
                </nav>
                <div class="row">
                    <div class="col-xs-12 fruit-content">
                        <img
                            id="main-photo"
                            class="img-responsive main-photo"
                            src="assets/placeholder.svg"
                            alt="Fruit image placeholder"
                        />
                        <div class="thumbnails" role="group" aria-label="Choose photo">
                            <button
                                class="thumbnail-button active"
                                aria-label="Photo 1"
                                aria-pressed="true"
                            >
                                <img src="assets/placeholder.svg" alt="" />
                            </button>
                            <button
                                class="thumbnail-button"
                                aria-label="Photo 2"
                                aria-pressed="false"
                            >
                                <img src="assets/placeholder.svg" alt="" />
                            </button>
                            <button
                                class="thumbnail-button"
                                aria-label="Photo 3"
                                aria-pressed="false"
                            >
                                <img src="assets/placeholder.svg" alt="" />
                            </button>
                        </div>
                        <section id="general-panel" class="fruit-panel">
                            <h1 id="fruit-name">Apricot, raw</h1>
                            <table class="table table-striped table-condensed">
                                <caption class="sr-only">
                                    Nutritional information
                                </caption>
                                <tbody>
                                    <tr>
                                        <th scope="row">Energy</th>
                                        <td>201 kJ (48 kcal)</td>
                                    </tr>
                                    <tr>
                                        <th scope="row">Carbohydrates</th>
                                        <td>11 g</td>
                                    </tr>
                                    <tr>
                                        <th scope="row">Protein</th>
                                        <td>1.4 g</td>
                                    </tr>
                                </tbody>
                            </table>
                        </section>
                        <section id="history-panel" class="fruit-panel" hidden>
                            <h1>History</h1>
                            <p>
                                Apricot is a cultivated stone fruit with a long history of
                                growing in temperate regions.
                            </p>
                        </section>
                        <section id="cultivation-panel" class="fruit-panel" hidden>
                            <h1>Cultivation</h1>
                            <p>
                                Apricot trees grow best in sunny locations with well-drained
                                soil.
                            </p>
                        </section>
                        <div
                            class="btn-group btn-group-justified tabs"
                            role="group"
                            aria-label="Fruit details"
                        >
                            <div class="btn-group">
                                <button
                                    class="btn btn-default active"
                                    data-panel="general-panel"
                                    aria-pressed="true"
                                >
                                    General
                                </button>
                            </div>
                            <div class="btn-group">
                                <button
                                    class="btn btn-default"
                                    data-panel="history-panel"
                                    aria-pressed="false"
                                >
                                    History
                                </button>
                            </div>
                            <div class="btn-group">
                                <button
                                    class="btn btn-default"
                                    data-panel="cultivation-panel"
                                    aria-pressed="false"
                                >
                                    Cultivation
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <div class="home-button" aria-hidden="true"></div>
        </div>
        <div
            class="modal fade"
            id="add-fruit"
            tabindex="-1"
            role="dialog"
            aria-labelledby="add-title"
        >
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <form id="fruit-form">
                        <div class="modal-header">
                            <button
                                type="button"
                                class="close"
                                data-dismiss="modal"
                                aria-label="Close"
                            >
                                &times;
                            </button>
                            <h2 id="add-title" class="modal-title">Add fruit</h2>
                        </div>
                        <div class="modal-body">
                            <label for="new-fruit">Fruit name</label
                            ><input
                                id="new-fruit"
                                class="form-control"
                                maxlength="80"
                                required
                            />
                        </div>
                        <div class="modal-footer">
                            <button
                                type="button"
                                class="btn btn-default"
                                data-dismiss="modal"
                            >
                                Cancel</button
                            ><button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
